<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>教学数字平台管理系统</title>
  <!-- Element Plus CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-plus@2.9.7/dist/index.css">
  <!-- 全局样式 -->

</head>
<body>
  <div id="app">
    <div class="app-layout">

      <!-- ========== 左侧边栏 ========== -->
      <aside class="sidebar">
        <div class="sidebar-logo">
          <span class="logo-icon">&#x1f3eb;</span>
          <span>教学管理平台</span>
        </div>
        <nav class="sidebar-menu">
          <div class="menu-title">导航菜单</div>
          <router-link
            v-for="item in menuItems"
            :key="item.path"
            :to="item.path"
            class="menu-item"
            :class="{ active: currentPath === item.path }"
          >
            <span class="menu-icon" v-html="item.icon"></span>
            <span>{{ item.label }}</span>
          </router-link>
        </nav>
      </aside>

      <!-- ========== 右侧主区域 ========== -->
      <div class="main-area">
        <header class="top-header">
          <div class="header-left">{{ currentPageTitle }}</div>
          <div class="header-right">
            <span class="user-info">
              <span class="user-avatar">{{ userInitial }}</span>
              <span>{{ userName }}</span>
            </span>
            <el-button type="danger" size="small" plain @click="handleLogout">退出登录</el-button>
          </div>
        </header>

        <main class="main-content">
          <router-view />
        </main>
      </div>
    </div>
  </div>

  <!-- Vue 3（开发版，无 sourceMap 警告） -->
  <script src="https://cdn.jsdelivr.net/npm/vue@3.4.21/dist/vue.global.js"></script>
  <!-- Vue Router 4（开发版） -->
  <script src="https://cdn.jsdelivr.net/npm/vue-router@4.3.0/dist/vue-router.global.js"></script>
  <!-- Element Plus（开发版） -->
  <script src="https://cdn.jsdelivr.net/npm/element-plus@2.9.7/dist/index.full.js"></script>
  <!-- ECharts（开发版） -->
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.js"></script>

  <script>
(function () {
  'use strict';

  /* ================================================================
   * 一、公共工具库（内联）
   * ================================================================ */

  // Token 管理
  function getToken()    { return localStorage.getItem('token'); }
  function setToken(t)   { localStorage.setItem('token', t); }
  function removeToken() { localStorage.removeItem('token'); localStorage.removeItem('user'); }
  function getUser()     { try { var r = localStorage.getItem('user'); return r ? JSON.parse(r) : null; } catch(e) { return null; } }
  function setUser(u)    { localStorage.setItem('user', JSON.stringify(u)); }

  // 枚举映射
  var GENDER_MAP = { 1: '男', 2: '女' };
  function genderLabel(v) { return GENDER_MAP[v] || '未知'; }

  // 消息提示（降级处理：如果 ElementPlus 未加载，使用 alert）
  function showSuccess(msg) {
    if (typeof ElementPlus !== 'undefined') { ElementPlus.ElMessage.success(msg); }
    else { alert(msg); }
  }
  function showError(msg) {
    if (typeof ElementPlus !== 'undefined') { ElementPlus.ElMessage.error(msg); }
    else { alert('错误：' + msg); }
  }
  function confirmDialog(msg, title) {
    if (typeof ElementPlus !== 'undefined') {
      return ElementPlus.ElMessageBox.confirm(msg, title || '提示', {
        confirmButtonText: '确定', cancelButtonText: '取消', type: 'warning'
      });
    }
    return Promise.resolve(); // 降级
  }
  function deepClone(obj) {
    if (!obj || typeof obj !== 'object') return obj;
    return JSON.parse(JSON.stringify(obj));
  }

  // 暴露全局
  var TP = {
    getToken: getToken, setToken: setToken, removeToken: removeToken,
    getUser: getUser, setUser: setUser,
    genderLabel: genderLabel,
    showSuccess: showSuccess, showError: showError,
    confirm: confirmDialog, deepClone: deepClone
  };

  /* ================================================================
   * 二、鉴权检查
   * ================================================================ */
  if (!TP.getToken()) {
    window.location.href = 'login.html';
  }

  /* ================================================================
   * 三、仪表盘页面组件
   * ================================================================ */

            '<div class="card-icon blue">&#x1f393;</div>' +
            '<div class="card-info">' +
              '<div class="card-value">{{ stats.studentCount }}</div>' +
              '<div class="card-label">学生总数</div>' +
            '</div>' +
          '</div>' +
          '<div class="stat-card">' +
            '<div class="card-icon green">&#x1f3eb;</div>' +

              '<div class="card-value">{{ stats.classCount }}</div>' +

            '<div ref="attendanceChart" class="chart-container"></div>' +

        '</div>' +
      '</div>',
    data: function () {
      return {
        stats: { studentCount: 1250, classCount: 24, attendanceRate: 96.5, pendingHomework: 38 },
        classData: [
          { name: '高一(1)班', count: 52 }, { name: '高一(2)班', count: 50 },

        ],
        classChartInstance: null,
        attendanceChartInstance: null
      };
    },
    mounted: function () {
      var self = this;
      self.$nextTick(function () {
        self.initClassChart();
        self.initAttendanceChart();
      });
      window.addEventListener('resize', self._handleResize);
    },
    beforeUnmount: function () {
      window.removeEventListener('resize', this._handleResize);
      if (this.classChartInstance) { this.classChartInstance.dispose(); }
      if (this.attendanceChartInstance) { this.attendanceChartInstance.dispose(); }
    },
    methods: {
      _handleResize: function () {
        if (this.classChartInstance) this.classChartInstance.resize();
        if (this.attendanceChartInstance) this.attendanceChartInstance.resize();
      },
      initClassChart: function () {
        var dom = this.$refs.classChart;
        if (!dom || typeof echarts === 'undefined') return;
        var self = this;
        this.classChartInstance = echarts.init(dom);
        this.classChartInstance.setOption({
          tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
          grid: { left: '3%', right: '4%', bottom: '10%', top: '8%', containLabel: true },
          xAxis: {
            type: 'category',
            data: self.classData.map(function(d) { return d.name; }),
            axisLabel: { rotate: 15, fontSize: 12 }
          },
          yAxis: { type: 'value', name: '学生人数', minInterval: 1 },
          series: [{
            name: '学生人数', type: 'bar',
            data: self.classData.map(function(d) { return d.count; }),
            itemStyle: {
              color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                { offset: 0, color: '#409eff' }, { offset: 1, color: '#79bbff' }
              ]),
              borderRadius: [4, 4, 0, 0]
            },
            barWidth: '50%',
            label: { show: true, position: 'top', fontSize: 12, color: '#303133' }
          }]
        });
      },
      initAttendanceChart: function () {
        var dom = this.$refs.attendanceChart;
        if (!dom || typeof echarts === 'undefined') return;
        var self = this;
        this.attendanceChartInstance = echarts.init(dom);

          tooltip: {
            trigger: 'axis',

          xAxis: {

            data: self.attendanceTrend.map(function(d) { return d.date; }),

            symbol: 'circle', symbolSize: 8,
            label: { show: true, fontSize: 12, color: '#303133', formatter: '{c}%' }

  function getRelatedCount(sid) {

  }

        return this.editForm.courseId ? getCourseFullScore(this.editForm.courseId) : 100;
      },
      filteredRecords: function () {
        var list = this.allRecords;
        var s = this.search;
        if (s.studentName) {
          var kw = s.studentName.trim();
          list = list.filter(function(r) { return r.studentName.indexOf(kw) !== -1; });
        }
        if (s.classId !== null && s.classId !== '') {
          var cid = s.classId;
          list = list.filter(function(r) { return r.classId === cid; });
        }
        if (s.courseId !== null && s.courseId !== '') {
          var coid = s.courseId;
          list = list.filter(function(r) { return r.courseId === coid; });
        }
        if (s.examName) {

          list = list.filter(function(r) { return r.examName.indexOf(ekw) !== -1; });
        }
        return list;

      handleEntrySubmit: function () {

          TP.showError('请选择班级和课程');
          return;

        if (!this.entry.examName.trim()) {
          TP.showError('请输入考试名称');
          return;

          TP.showError('请选择考试类型');
          return;

          return;

        if (this.entryStudents.length === 0) {
          TP.showError('该班级没有学生');
          return;
        }
        // 校验分数
        var maxScore = this.entryMaxScore;
        var hasError = false;
        for (var i = 0; i < this.entryStudents.length; i++) {
          var s = this.entryStudents[i];
          if (!s.absent && (s.score === null || s.score === undefined)) {
            TP.showError(s.name + ' 未填写分数，请填写或勾选缺考');
            hasError = true;
            break;
          }
          if (!s.absent && s.score > maxScore) {

            hasError = true;
            break;

            var dup = self.allRecords.filter(function(r) {
              return r.studentId === s.id &&

                     r.examName === self.entry.examName.trim();
            });
            if (dup.length > 0) continue;

              id: scoreNextId++,
              studentId: s.id,
              studentNo: s.studentNo,
              studentName: s.name,
              classId: self.entry.classId,
              courseId: self.entry.courseId,
              examName: self.entry.examName.trim(),
              examType: self.entry.examType,
              score: s.absent ? null : s.score,
              examDate: self.entry.examDate,
              absent: s.absent

          });

          self.editDialogVisible = false;

      calcStats: function () {
        if (!this.statsExamName.trim() || !this.statsClassId || !this.statsCourseId) {
          TP.showError('请填写考试名称、班级和课程');
          return;
        }
        var ename = this.statsExamName.trim();
        var cid = this.statsClassId;
        var coid = this.statsCourseId;
        var records = this.allRecords.filter(function(r) {
          return r.examName === ename && r.classId === cid && r.courseId === coid;
        });
        if (records.length === 0) {
          TP.showError('未查询到匹配的成绩记录');
          this.statsResult = null;
          return;
        }
        var validRecords = records.filter(function(r) { return !r.absent; });
        var absentCount = records.length - validRecords.length;
        if (validRecords.length === 0) {
          this.statsResult = {
            max: '-', min: '-', avg: '-', passCount: 0, passRate: 0, absentCount: absentCount
          };
          return;
        }
        var scores = validRecords.map(function(r) { return r.score; });
        var max = Math.max.apply(null, scores);
        var min = Math.min.apply(null, scores);
        var sum = scores.reduce(function(a, b) { return a + b; }, 0);
        var avg = (sum / scores.length).toFixed(1);
        var fullScore = getCourseFullScore(coid);
        var passLine = fullScore * 0.6;
        var passCount = validRecords.filter(function(r) { return r.score >= passLine; }).length;
        var passRate = (passCount / validRecords.length * 100).toFixed(1);
        this.statsResult = {
          max: max, min: min, avg: avg,
          passCount: passCount, passRate: passRate,
          absentCount: absentCount
        };

    { id: 1, name: '语文' }, { id: 2, name: '数学' }, { id: 3, name: '英语' },
    { id: 4, name: '物理' }, { id: 5, name: '化学' }, { id: 6, name: '生物' },
    { id: 7, name: '历史' }, { id: 8, name: '地理' }, { id: 9, name: '政治' }
  ];

  function formatNow() {
    var d = new Date();
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2) + ' ' +
           ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
  }

  // 作业列表
  var homeworkList = [];
  var hwNextId = 1;

  // 提交记录列表（keyed by homeworkId → array）
  var submissionMap = {};

  (function initMockHomeworks() {
    var data = [
      { title: '《红楼梦》读后感', content: '阅读《红楼梦》前30回，撰写一篇不少于800字的读后感，要求观点明确、分析深入。', classId: 1, courseId: 1, publishTime: '2026-05-15 09:00', deadline: '2026-05-30 23:59' },
      { title: '三角函数练习题', content: '完成课本P56-P58页的全部习题，包括基础题和拓展题。要求书写工整，步骤完整。', classId: 1, courseId: 2, publishTime: '2026-05-16 10:30', deadline: '2026-05-23 18:00' },
      { title: '英语短文背诵', content: '背诵Unit 5课文全文，下周一课堂抽查。同时完成课后练习册对应单元。', classId: 2, courseId: 3, publishTime: '2026-05-18 14:00', deadline: '2026-05-25 08:00' },
      { title: '力学实验报告', content: '根据上周五的力学实验数据，完成实验报告的撰写。包含实验目的、步骤、数据记录、结果分析和结论。', classId: 4, courseId: 4, publishTime: '2026-05-20 08:00', deadline: '2026-05-28 23:59' }
    ];

    data.forEach(function(d) {
      var hwId = hwNextId++;
      d.id = hwId;
      homeworkList.push(d);

      // 生成提交记录（部分学生）
      var students = mockClassStudentsMap[d.classId] || [];
      var subs = [];
      students.forEach(function(s, idx) {
        var status;
        var score = null;
        var comment = '';
        var submitContent = '';
        if (idx < 2) {
          // 已批改
          status = 3;
          score = Math.floor(Math.random() * 30 + 70);
          comment = score >= 85 ? '完成得很好，继续保持！' : '基本完成，还有提升空间。';
          submitContent = s.name + '提交的作业内容……';
        } else if (idx < students.length - 1) {
          // 已提交待批改
          status = 2;
          submitContent = s.name + '提交的作业内容……';
        } else {
          // 未提交
          status = 1;
        }
        subs.push({
          id: hwId * 1000 + idx,
          homeworkId: hwId,
          studentId: s.id,
          studentNo: s.studentNo,
          studentName: s.name,
          status: status,
          isLate: false,
          score: score,
          comment: comment,
          submitContent: submitContent
        });
      });
      submissionMap[hwId] = subs;
    });
  })();

  var HomeworkPage = {
    template:
      '<div>' +
        '<!-- 搜索栏 -->' +
        '<div class="toolbar">' +
          '<el-select v-model="search.classId" placeholder="班级" clearable style="width: 180px">' +
            '<el-option v-for="c in classOptions" :key="c.id" :label="c.name" :value="c.id" />' +
          '</el-select>' +
          '<el-select v-model="search.courseId" placeholder="课程" clearable style="width: 180px">' +
            '<el-option v-for="c in courseOptions" :key="c.id" :label="c.name" :value="c.id" />' +
          '</el-select>' +
          '<el-button type="primary" @click="handleSearch">搜索</el-button>' +
          '<el-button @click="handleReset">重置</el-button>' +
          '<span class="toolbar-spacer"></span>' +
          '<el-button type="primary" @click="handleOpenPublish">发布作业</el-button>' +
        '</div>' +

        '<!-- 作业列表 -->' +
        '<div class="table-panel">' +
          '<el-table :data="pagedData" border stripe style="width: 100%" empty-text="暂无数据">' +
            '<el-table-column prop="title" label="作业标题" min-width="180" show-overflow-tooltip />' +
            '<el-table-column label="班级" width="120">' +
              '<template v-slot="{ row }">{{ getClassName(row.classId) }}</template>' +
            '</el-table-column>' +
            '<el-table-column label="课程" width="100">' +
              '<template v-slot="{ row }">{{ getCourseName(row.courseId) }}</template>' +
            '</el-table-column>' +
            '<el-table-column prop="publishTime" label="发布时间" width="150" />' +
            '<el-table-column prop="deadline" label="截止时间" width="150" />' +
            '<el-table-column label="提交情况" width="120" align="center">' +
              '<template v-slot="{ row }">' +
                '<span>{{ getSubmitStats(row.id) }}</span>' +
              '</template>' +
            '</el-table-column>' +
            '<el-table-column label="操作" width="220" align="center" fixed="right">' +
              '<template v-slot="{ row }">' +
                '<el-button type="primary" size="small" link @click="handleViewSubmissions(row)">查看提交</el-button>' +
                '<el-button type="primary" size="small" link @click="handleEditHomework(row)">编辑</el-button>' +
                '<el-button type="danger" size="small" link @click="handleDeleteHomework(row)">删除</el-button>' +
              '</template>' +
            '</el-table-column>' +
          '</el-table>' +
          '<div style="display: flex; justify-content: flex-end; padding: 16px 0;">' +
            '<el-pagination' +
              ' v-model:current-page="currentPage"' +
              ' v-model:page-size="pageSize"' +
              ' :page-sizes="[5, 10, 15]"' +
              ' :total="filteredTotal"' +
              ' layout="total, sizes, prev, pager, next, jumper"' +
              ' background' +
            '/>' +
          '</div>' +
        '</div>' +

        '<!-- 发布/编辑作业弹窗 -->' +
        '<el-dialog v-model="publishDialogVisible" :title="publishDialogTitle" width="560px" :close-on-click-modal="false" @closed="resetPublishForm">' +
          '<el-form ref="publishFormRef" :model="publishForm" :rules="publishRules" label-width="90px" class="dialog-form">' +
            '<el-form-item label="作业标题" prop="title">' +
              '<el-input v-model="publishForm.title" placeholder="请输入作业标题" maxlength="50" />' +
            '</el-form-item>' +
            '<el-form-item label="内容描述">' +
              '<el-input v-model="publishForm.content" type="textarea" :rows="4" placeholder="请输入作业内容和要求" maxlength="2000" />' +
            '</el-form-item>' +
            '<el-form-item label="班级" prop="classId">' +
              '<el-select v-model="publishForm.classId" placeholder="请选择班级" style="width: 100%">' +
                '<el-option v-for="c in classOptions" :key="c.id" :label="c.name" :value="c.id" />' +
              '</el-select>' +
            '</el-form-item>' +
            '<el-form-item label="课程" prop="courseId">' +
              '<el-select v-model="publishForm.courseId" placeholder="请选择课程" style="width: 100%">' +
                '<el-option v-for="c in courseOptions" :key="c.id" :label="c.name" :value="c.id" />' +
              '</el-select>' +
            '</el-form-item>' +
            '<el-form-item label="截止时间" prop="deadline">' +
              '<el-date-picker v-model="publishForm.deadline" type="datetime" format="YYYY-MM-DD HH:mm" value-format="YYYY-MM-DD HH:mm" placeholder="选择截止时间" style="width: 100%" />' +
            '</el-form-item>' +
          '</el-form>' +
          '<template #footer>' +
            '<el-button @click="publishDialogVisible = false">取消</el-button>' +
            '<el-button type="primary" :loading="publishSubmitting" @click="handlePublishSubmit">确定</el-button>' +
          '</template>' +
        '</el-dialog>' +

        '<!-- 提交详情弹窗 -->' +
        '<el-dialog v-model="submissionDialogVisible" :title="\'提交详情：\' + submissionHomewordTitle" width="800px">' +
          '<el-table :data="currentSubmissions" border stripe style="width: 100%" max-height="420">' +
            '<el-table-column prop="studentNo" label="学号" width="120" />' +
            '<el-table-column prop="studentName" label="姓名" width="100" />' +
            '<el-table-column label="状态" width="140" align="center">' +
              '<template v-slot="{ row }">' +
                '<el-tag :type="getStatusTagType(row.status)" size="small">{{ getHwStatusLabel(row.status) }}</el-tag>' +
                '<span v-if="row.isLate" style="margin-left: 4px;">' +
                  '<el-tag type="danger" size="small">迟交</el-tag>' +
                '</span>' +
              '</template>' +
            '</el-table-column>' +
            '<el-table-column label="分数" width="80" align="center">' +
              '<template v-slot="{ row }">{{ row.status === 3 ? row.score : \'-\' }}</template>' +
            '</el-table-column>' +
            '<el-table-column label="操作" width="120" align="center" fixed="right">' +
              '<template v-slot="{ row }">' +
                '<el-button v-if="row.status === 2" type="primary" size="small" link @click="handleOpenReview(row)">批改</el-button>' +
                '<el-button v-if="row.status === 3" type="primary" size="small" link @click="handleOpenReview(row)">查看</el-button>' +
                '<span v-if="row.status === 1" style="color: #909399; font-size: 12px;">--</span>' +
              '</template>' +
            '</el-table-column>' +
          '</el-table>' +
        '</el-dialog>' +

        '<!-- 批改弹窗 -->' +
        '<el-dialog v-model="reviewDialogVisible" :title="reviewDialogTitle" width="480px" :close-on-click-modal="false">' +
          '<el-form :model="reviewForm" label-width="90px" class="dialog-form">' +
            '<el-form-item label="学生">' +
              '<el-input :model-value="reviewForm.studentName" disabled />' +
            '</el-form-item>' +
            '<el-form-item label="提交内容">' +
              '<div style="padding: 12px; background: #f5f7fa; border-radius: 4px; min-height: 60px; font-size: 13px; color: #606266; white-space: pre-wrap;">{{ reviewForm.content }}</div>' +
            '</el-form-item>' +
            '<el-form-item label="分数">' +
              '<el-input-number v-model="reviewForm.score" :min="0" :max="100" :precision="1" style="width: 100%" />' +
            '</el-form-item>' +
            '<el-form-item label="评语">' +
              '<el-input v-model="reviewForm.comment" type="textarea" :rows="3" placeholder="请输入评语" maxlength="500" />' +
            '</el-form-item>' +
          '</el-form>' +
          '<template #footer>' +
            '<el-button @click="reviewDialogVisible = false">取消</el-button>' +
            '<el-button type="primary" :loading="reviewSubmitting" @click="handleReviewSubmit">保存批改</el-button>' +
          '</template>' +
        '</el-dialog>' +
      '</div>',
    data: function () {
      return {
        search: { classId: null, courseId: null },
        classOptions: hwClassOptions,
        courseOptions: hwCourseOptions,
        allHomeworks: homeworkList.slice(),
        currentPage: 1, pageSize: 10,
        // 发布/编辑弹窗
        publishDialogVisible: false, publishDialogTitle: '发布作业',
        isEdit: false, editHwId: null, publishSubmitting: false,
        publishForm: { title: '', content: '', classId: null, courseId: null, deadline: '' },
        publishRules: {
          title: [{ required: true, message: '请输入作业标题', trigger: 'blur' }],
          classId: [{ required: true, message: '请选择班级', trigger: 'change' }],
          courseId: [{ required: true, message: '请选择课程', trigger: 'change' }],
          deadline: [{ required: true, message: '请选择截止时间', trigger: 'change' }]
        },
        // 提交详情弹窗
        submissionDialogVisible: false, submissionHomewordTitle: '',
        currentSubmissions: [], currentViewHwId: null,
        // 批改弹窗
        reviewDialogVisible: false, reviewDialogTitle: '批改作业',
        reviewForm: { submissionId: null, studentName: '', content: '', score: null, comment: '' },
        reviewSubmitting: false
      };
    },
    computed: {
      filteredHomeworks: function () {
        var list = this.allHomeworks;
        var s = this.search;
        if (s.classId !== null && s.classId !== '') {
          var cid = s.classId;
          list = list.filter(function(h) { return h.classId === cid; });
        }
        if (s.courseId !== null && s.courseId !== '') {
          var coid = s.courseId;
          list = list.filter(function(h) { return h.courseId === coid; });
        }
        return list;
      },
      filteredTotal: function () { return this.filteredHomeworks.length; },
      pagedData: function () {
        var s = (this.currentPage - 1) * this.pageSize;
        return this.filteredHomeworks.slice(s, s + this.pageSize);
      }
    },
    methods: {
      getClassName: function (id) {
        var c = this.classOptions.filter(function(x) { return x.id === id; })[0];
        return c ? c.name : '未知';
      },
      getCourseName: function (id) {
        var c = this.courseOptions.filter(function(x) { return x.id === id; })[0];
        return c ? c.name : '未知';
      },
      getHwStatusLabel: getHwStatusLabel,
      getStatusTagType: function (status) {
        if (status === 3) return 'success';
        if (status === 2) return 'warning';
        return 'info';
      },
      getSubmitStats: function (hwId) {
        var subs = submissionMap[hwId] || [];
        var reviewed = subs.filter(function(s) { return s.status === 3; }).length;
        return reviewed + '/' + subs.length;
      },
      handleSearch: function () { this.currentPage = 1; },
      handleReset: function () {
        this.search = { classId: null, courseId: null };
        this.currentPage = 1;
      },

      // 发布作业
      handleOpenPublish: function () {
        this.publishDialogTitle = '发布作业';
        this.isEdit = false; this.editHwId = null;
        this.publishForm = { title: '', content: '', classId: null, courseId: null, deadline: '' };
        this.publishDialogVisible = true;
      },

      // 编辑作业
      handleEditHomework: function (row) {
        this.publishDialogTitle = '编辑作业';
        this.isEdit = true; this.editHwId = row.id;
        this.publishForm = {
          title: row.title, content: row.content,
          classId: row.classId, courseId: row.courseId, deadline: row.deadline
        };
        this.publishDialogVisible = true;
      },

      // 删除作业
      handleDeleteHomework: function (row) {
        var subs = submissionMap[row.id] || [];
        var msg = '确定删除作业「' + row.title + '」吗？';
        if (subs.length > 0) {
          msg += '\n\n该作业下有 ' + subs.length + ' 条提交记录，删除后将一并移除。';
        }
        var self = this;
        TP.confirm(msg, '删除确认').then(function () {
          self.allHomeworks = self.allHomeworks.filter(function(h) { return h.id !== row.id; });
          delete submissionMap[row.id];
          self.$forceUpdate();
          var maxPage = Math.ceil(self.filteredHomeworks.length / self.pageSize) || 1;
          if (self.currentPage > maxPage) self.currentPage = maxPage;
          TP.showSuccess('删除成功');
        }).catch(function () {});
      },

      // 提交/发布
      handlePublishSubmit: function () {
        var self = this;
        this.$refs.publishFormRef.validate(function(valid) {
          if (!valid) return;

          // 截止时间校验
          var now = new Date();
          var deadline = new Date(self.publishForm.deadline);
          if (deadline <= now) {
            TP.showError('截止时间必须晚于当前时间');
            return;
          }

          self.publishSubmitting = true;
          setTimeout(function () {
            if (self.isEdit) {
              self.allHomeworks = self.allHomeworks.map(function(h) {
                if (h.id === self.editHwId) {
                  return {
                    id: h.id, title: self.publishForm.title, content: self.publishForm.content,
                    classId: self.publishForm.classId, courseId: self.publishForm.courseId,
                    publishTime: h.publishTime, deadline: self.publishForm.deadline
                  };
                }
                return h;
              });
              TP.showSuccess('修改成功');
            } else {
              var newId = hwNextId++;
              self.allHomeworks.push({
                id: newId, title: self.publishForm.title, content: self.publishForm.content,
                classId: self.publishForm.classId, courseId: self.publishForm.courseId,
                publishTime: formatNow(), deadline: self.publishForm.deadline
              });
              // 自动为全班创建提交记录
              var students = mockClassStudentsMap[self.publishForm.classId] || [];
              var subs = students.map(function(s) {
                return {
                  id: newId * 1000 + s.id,
                  homeworkId: newId, studentId: s.id,
                  studentNo: s.studentNo, studentName: s.name,
                  status: 1, isLate: false, score: null, comment: '', submitContent: ''
                };
              });
              submissionMap[newId] = subs;
              TP.showSuccess('发布成功，已为 ' + subs.length + ' 名学生创建提交记录');
              self.currentPage = Math.ceil(self.filteredHomeworks.length / self.pageSize) || 1;
            }
            self.publishDialogVisible = false;
            self.publishSubmitting = false;
          }, 300);
        });
      },
      resetPublishForm: function () {
        this.publishForm = { title: '', content: '', classId: null, courseId: null, deadline: '' };
        if (this.$refs.publishFormRef) this.$refs.publishFormRef.resetFields();
      },

      // 查看提交
      handleViewSubmissions: function (row) {
        this.currentViewHwId = row.id;
        this.submissionHomewordTitle = row.title;
        this.currentSubmissions = submissionMap[row.id] || [];
        this.submissionDialogVisible = true;
      },

      // 批改
      handleOpenReview: function (row) {
        this.reviewDialogTitle = row.status === 3 ? '查看批改' : '批改作业';
        this.reviewForm = {
          submissionId: row.id,
          studentName: row.studentName,
          content: row.submitContent || '（未提交内容）',
          score: row.score,
          comment: row.comment
        };
        this.reviewDialogVisible = true;
      },
      handleReviewSubmit: function () {
        if (this.reviewForm.score === null || this.reviewForm.score === undefined) {
          TP.showError('请输入分数');
          return;
        }
        var self = this;
        this.reviewSubmitting = true;
        setTimeout(function () {
          var subs = submissionMap[self.currentViewHwId];
          if (subs) {
            subs = subs.map(function(s) {
              if (s.id === self.reviewForm.submissionId) {
                s.status = 3;
                s.score = self.reviewForm.score;
                s.comment = self.reviewForm.comment || '';
              }
              return s;
            });
            submissionMap[self.currentViewHwId] = subs;
            self.currentSubmissions = subs;
          }
          self.reviewSubmitting = false;
          self.reviewDialogVisible = false;
          self.$forceUpdate();
          TP.showSuccess('批改完成');
        }, 300);
      }
    }
  };

  /* ================================================================
   * 十一、路由配置
   * ================================================================ */
  var placeholderTemplate = function (title) {
    return '<div class="empty-placeholder">' +
      '<div class="empty-icon">&#x1f6a7;</div>' +
      '<div>' + title + ' —— 页面开发中，敬请期待</div>' +
      '</div>';
  };

  var routes = [
    { path: '/',              redirect: '/dashboard' },
    { path: '/dashboard',     name: 'Dashboard',    component: DashboardPage },
    { path: '/student',       name: 'Student',      component: StudentPage },
    { path: '/class',         name: 'Class',        component: ClassPage },
    { path: '/course',        name: 'Course',       component: CoursePage },
    { path: '/schedule',      name: 'Schedule',     component: SchedulePage },
    { path: '/attendance',    name: 'Attendance',   component: AttendancePage },
    { path: '/score',         name: 'Score',        component: ScorePage },
    { path: '/homework',      name: 'Homework',     component: HomeworkPage }
  ];

  var router = VueRouter.createRouter({
    history: VueRouter.createWebHashHistory(),
    routes: routes
  });

  router.beforeEach(function (to, from, next) {
    if (!TP.getToken()) {
      window.location.href = 'login.html';
    } else {
      next();
    }
  });

  /* ================================================================
   * 十二、菜单配置
   * ================================================================ */
  var menuItems = [
    { path: '/dashboard',   label: '仪表盘',   icon: '&#x1f4ca;' },
    { path: '/student',     label: '学生管理',  icon: '&#x1f393;' },
    { path: '/class',       label: '班级管理',  icon: '&#x1f3eb;' },
    { path: '/course',      label: '课程管理',  icon: '&#x1f4da;' },
    { path: '/schedule',    label: '课程排课',  icon: '&#x1f4c5;' },
    { path: '/attendance',  label: '考勤打卡',  icon: '&#x2705;' },
    { path: '/score',       label: '成绩管理',  icon: '&#x1f3c6;' },
    { path: '/homework',    label: '作业管理',  icon: '&#x1f4dd;' }
  ];

  var titleMap = {
    '/dashboard':  '仪表盘',   '/student':    '学生管理',
    '/class':      '班级管理', '/course':     '课程管理',
    '/schedule':   '课程排课', '/attendance': '考勤打卡',
    '/score':      '成绩管理', '/homework':   '作业管理'
  };

  /* ================================================================
   * 十三、启动 Vue 应用
   * ================================================================ */
  var app = Vue.createApp({
    data: function () {
      return {
        menuItems: menuItems,
        currentPath: window.location.hash.replace('#', '') || '/dashboard'
      };
    },
    computed: {
      currentPageTitle: function () {
        return titleMap[this.currentPath] || '仪表盘';
      },
      userName: function () {
        var user = TP.getUser();
        return user ? (user.teacherName || user.username) : '未知用户';
      },
      userInitial: function () {
        var name = this.userName;
        return name ? name.charAt(0) : 'U';
      }
    },
    methods: {
      handleLogout: function () {
        TP.removeToken();
        TP.showSuccess('退出成功');
        setTimeout(function () { window.location.href = 'login.html'; }, 500);
      }
    },
    watch: {
      '$route': function (to) { this.currentPath = to.path; }
    }
  });

  app.use(ElementPlus);
  app.use(router);
  app.mount('#app');
})();
  </script>
</body>
</html>
