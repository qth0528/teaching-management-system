<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>教学数字平台管理系统 - 登录</title>
  <!-- Element Plus CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-plus@2.9.7/dist/index.css">
  <!-- 全局样式 -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <div class="login-page">
      <div class="login-card">
        <!-- 系统标题 -->
        <div class="login-title">教学数字平台管理系统</div>
        <div class="login-subtitle">Teaching Digital Platform</div>

        <!-- 登录表单 -->
        <el-form
          ref="formRef"
          :model="form"
          :rules="rules"
          @keyup.enter="handleLogin"
        >
          <!-- 用户名 -->
          <el-form-item prop="username">
            <el-input
              v-model="form.username"
              placeholder="请输入用户名"
              size="large"
              clearable
            />
          </el-form-item>

          <!-- 密码 -->
          <el-form-item prop="password">
            <el-input
              v-model="form.password"
              type="password"
              placeholder="请输入密码"
              size="large"
              show-password
              clearable
            />
          </el-form-item>

          <!-- 记住密码 -->
          <el-form-item>
            <el-checkbox v-model="form.remember">记住密码</el-checkbox>
          </el-form-item>

          <!-- 登录按钮 -->
          <el-form-item>
            <el-button
              type="primary"
              size="large"
              style="width: 100%"
              :loading="loading"
              @click="handleLogin"
            >
              {{ loading ? '登录中...' : '登 录' }}
            </el-button>
          </el-form-item>
        </el-form>
      </div>
    </div>
  </div>

  <!-- Vue 3（开发版，无 sourceMap 警告） -->
  <script src="https://cdn.jsdelivr.net/npm/vue@3.4.21/dist/vue.global.js"></script>
  <!-- Element Plus（开发版） -->
  <script src="https://cdn.jsdelivr.net/npm/element-plus@2.9.7/dist/index.full.js"></script>

  <script>
    const { createApp, ref, reactive, onMounted } = Vue;
    const { ElMessage } = ElementPlus;

    const app = createApp({
      setup() {
        // 表单数据
        const form = reactive({
          username: '',
          password: '',
          remember: false
        });

        // 表单引用
        const formRef = ref(null);

        // 加载状态
        const loading = ref(false);

        // 表单校验规则
        const rules = {
          username: [
            { required: true, message: '请输入用户名', trigger: 'blur' }
          ],
          password: [
            { required: true, message: '请输入密码', trigger: 'blur' }
          ]
        };

        // 登录处理
        const handleLogin = async () => {
          // 表单校验
          const valid = await formRef.value.validate().catch(() => false);
          if (!valid) return;

          loading.value = true;

          try {
            // 开发环境直接写死后端地址，部署到同一域名时改为 '/api/login'
            const apiBase = 'http://localhost:8080';
            const response = await fetch(apiBase + '/api/login', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                username: form.username,
                password: form.password
              })
            });

            const result = await response.json();

            if (result.code === 200 && result.data) {
              // 登录成功：存储 token 和用户信息
              localStorage.setItem('token', result.data.token);
              localStorage.setItem('user', JSON.stringify({
                userId: result.data.userId,
                username: result.data.username
              }));

              // 记住密码
              if (form.remember) {
                localStorage.setItem('rememberedUsername', form.username);
              } else {
                localStorage.removeItem('rememberedUsername');
              }

              ElMessage.success('登录成功');
              setTimeout(() => {
                window.location.href = 'index.html';
              }, 300);
            } else {
              // 根据错误码展示对应提示（401→密码错误，403→账号锁定）
              if (result.code === 403) {
                ElMessage.error(result.message || '账号已被锁定，请稍后再试');
              } else {
                ElMessage.error(result.message || '用户名或密码错误');
              }
              loading.value = false;
            }
          } catch (e) {
            ElMessage.error('网络异常，请检查网络连接');
            loading.value = false;
          }
        };

        // 页面加载时读取记住的用户名
        onMounted(() => {
          const remembered = localStorage.getItem('rememberedUsername');
          if (remembered) {
            form.username = remembered;
            form.remember = true;
          }
        });

        return {
          form,
          formRef,
          loading,
          rules,
          handleLogin
        };
      }
    });

    app.use(ElementPlus);
    app.mount('#app');
  </script>
</body>
</html>
